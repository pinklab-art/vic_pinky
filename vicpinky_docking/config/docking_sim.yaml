# 도킹 서버 (opennav_docking) — 시뮬
# 같은 마커를 보는 도크를 두 개 둔다. 도킹 BT(behavior_trees/dock_to_station.xml)가 차례로 부른다.
#   home_align : 2 정렬 — 마커 정면에 바르게 선다
#   home_dock  : 3 전진 — 차체 앞면이 도크에 닿을 때까지 들어간다
docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 50.0
    base_frame: base_link
    fixed_frame: odom
    dock_prestaging_tolerance: 0.5
    max_retries: 3
    controller:
      dock_collision_threshold: 0.5   # 기본 0.3 이면 도크 자체를 장애물로 보고 멈춘다
    dock_plugins: ["vicpinky_align", "vicpinky_contact"]

    vicpinky_align:                   # 2 정렬
      plugin: "opennav_docking::SimpleNonChargingDock"
      use_external_detection_pose: true
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.39   # 마커면 → base_link (m). 카메라-마커 약 0.3 m
      external_detection_translation_y: 0.0
      external_detection_rotation_pitch: 1.57
      external_detection_rotation_roll: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1                # 새 측정값 비중
      docking_threshold: 0.03         # 이 거리 안이면 정렬 끝 (m)
      staging_x_offset: -0.7
      staging_yaw_offset: 0.0

    vicpinky_contact:                 # 3 전진
      plugin: "opennav_docking::SimpleNonChargingDock"
      use_external_detection_pose: true
      external_detection_timeout: 3.0 # 마커가 안 보여도 이 시간 동안은 마지막으로 본 위치로 간다
      external_detection_translation_x: -0.085  # 앞면(base_link +0.1)이 도크에 닿는 자리
      external_detection_translation_y: 0.0
      external_detection_rotation_pitch: 1.57
      external_detection_rotation_roll: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
      docking_threshold: 0.02
      staging_x_offset: -0.7          # 언도킹 때 물러나는 거리
      staging_yaw_offset: 0.0

    docks: ["home_align", "home_dock"]
    # 각 단계를 마친 base_link 자세 (map x, y, yaw). 마커면 중심은 맵 (5.5, 1.36)
    home_align:
      type: "vicpinky_align"
      frame: "map"
      pose: [5.5, 0.97, 1.5708]
    home_dock:
      type: "vicpinky_contact"
      frame: "map"
      pose: [5.5, 1.275, 1.5708]
